# mise configuration for SAGE Learning
# All tasks use flat underscore naming for mise 2026.8.5 compatibility.
# Backend tasks invoke .venv Python directly (no activation needed).
# Run explicitly with `mise run <task>`.

[env]
DEBUG = "True"
GROQ_MODEL_NAME = "llama-3.3-70b-versatile"
FIREBASE_PROJECT_ID = "sage-a47b8"
EXPO_PUBLIC_API_URL = "http://localhost:8000/api"

# NOTE: Secrets (DJANGO_SECRET_KEY, GROQ_API_KEY, DEEPSEEK_API_KEY,
# FIREBASE_SERVICE_ACCOUNT) are loaded from committed root .env.
# Never put real credentials here.

[tasks.setup]
description = "Full initial setup from fresh clone"
depends = ["setup_backend", "setup_mobile"]

[tasks.setup_backend]
description = "Create venv, install deps, migrate, seed"
dir = "backend_api/core"
run = """
python -m venv .venv && .venv/bin/pip install -r requirements.txt && .venv/bin/python manage.py migrate && .venv/bin/python manage.py seed_data
"""
run_windows = "setup.bat"

[tasks.setup_mobile]
description = "Install mobile npm dependencies"
dir = "mobile_app"
run = "npm install"

[tasks.backend_run]
description = "Run Django dev server on :8000"
dir = "backend_api/core"
run = ".venv/bin/python manage.py runserver"
run_windows = ".venv\\Scripts\\python manage.py runserver"

[tasks.backend_test]
description = "Run Django tests"
dir = "backend_api/core"
run = ".venv/bin/python manage.py test"
run_windows = ".venv\\Scripts\\python manage.py test"

[tasks.backend_migrate]
description = "Apply database migrations"
dir = "backend_api/core"
run = ".venv/bin/python manage.py migrate"
run_windows = ".venv\\Scripts\\python manage.py migrate"

[tasks.backend_makemigrations]
description = "Create migrations from model changes"
dir = "backend_api/core"
run = ".venv/bin/python manage.py makemigrations"
run_windows = ".venv\\Scripts\\python manage.py makemigrations"

[tasks.backend_seed]
description = "Seed database with sample data"
dir = "backend_api/core"
run = ".venv/bin/python manage.py seed_data"
run_windows = ".venv\\Scripts\\python manage.py seed_data"

[tasks.backend_shell]
description = "Open Django shell"
dir = "backend_api/core"
run = ".venv/bin/python manage.py shell"
run_windows = ".venv\\Scripts\\python manage.py shell"

[tasks.backend_superuser]
description = "Create Django superuser"
dir = "backend_api/core"
run = ".venv/bin/python manage.py createsuperuser"
run_windows = ".venv\\Scripts\\python manage.py createsuperuser"

[tasks.backend_testapi]
description = "Run manual API smoke test"
dir = "backend_api/core"
run = ".venv/bin/python test_api.py"
run_windows = ".venv\\Scripts\\python test_api.py"

[tasks.mobile_start]
description = "Start Expo dev server"
dir = "mobile_app"
run = "npm start"

[tasks.mobile_web]
description = "Start Expo for web"
dir = "mobile_app"
run = "npm run web"

[tasks.mobile_android]
description = "Build and run on Android"
dir = "mobile_app"
run = "npm run android"

[tasks.mobile_ios]
description = "Build and run on iOS"
dir = "mobile_app"
run = "npm run ios"

[tasks.mobile_lint]
description = "Lint mobile app"
dir = "mobile_app"
run = "npm run lint"

[tasks.firestore_deploy]
description = "Deploy Firestore rules/indexes"
dir = "backend_api/firebase-config"
run = "firebase deploy --only firestore"